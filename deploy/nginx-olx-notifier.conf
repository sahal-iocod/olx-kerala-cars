# nginx reverse proxy for the OLX notifier web UI.
# The Flask app has NO login of its own — basic auth here is what
# keeps strangers from starting/stopping your bot.
#
# Install:
#   sudo apt install -y nginx apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-olx <your-username>
#   sudo cp deploy/nginx-olx-notifier.conf /etc/nginx/sites-available/olx-notifier
#   sudo ln -s /etc/nginx/sites-available/olx-notifier /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Optional HTTPS (needs a domain pointing at the VPS):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d olx.example.com

server {
    listen 80;
    listen [::]:80;
    # Replace with your domain, or keep "_" to answer on the bare IP.
    server_name _;

    auth_basic "OLX Notifier";
    auth_basic_user_file /etc/nginx/.htpasswd-olx;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
